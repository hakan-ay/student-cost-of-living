name: CI

# Builds and tests the dbt project on the committed raw data (no network calls to the sources).
on:
  push:
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked

      - name: dbt build (seeds, models, tests)
        working-directory: dbt
        run: uv run dbt build

      - name: README numbers match the marts
        run: uv run python src/update_readme.py --check
