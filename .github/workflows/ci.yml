name: CI

# Unit tests, then builds and tests the dbt project on the committed raw data (no network calls, no API key).
on:
  push:
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked

      - name: Unit tests (guardrail, publishing, dashboard smoke test)
        run: uv run pytest -q

      - name: Weekly updates page matches the published briefs
        run: uv run python src/brief.py index --check

      - name: requirements.txt (Streamlit Cloud) matches uv.lock
        run: |
          uv export --only-group dashboard --no-hashes --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)

      - name: dbt build (seeds, models, tests)
        working-directory: dbt
        run: uv run dbt build

      - name: README numbers match the marts
        run: uv run python src/update_readme.py --check
