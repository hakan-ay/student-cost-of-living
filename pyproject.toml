[project]
name = "student-cost-of-living"
version = "0.1.0"
description = "Automated pipeline on the monthly cost of a Turkish student in Italy, in EUR and TRY (ECB, Eurostat, Istat, dbt, DuckDB)"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=2.0.0",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
